[project]
name = "medleyplay"
version = "0.0.0"
description = "Play music on your local network, from your own files and from Bilibili."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "fsspec>=2026.9.0",
    "keyring>=25",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "tinytag>=2.3.2",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
medleyplay = "medleyplay.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit",
    "httpx2>=2.16.0",
    "hypothesis",
    "import-linter>=2.15",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict but sensible: start from `ALL` so a rule category is never missed by
# omission, then name each exclusion and the reason for it. A new ruff release can
# add rules, which show up as lint failures in the upgrade pull request.
select = ["ALL"]
ignore = [
    "CPY001", # copyright headers: the LICENSE file covers the repository
    "COM812", # trailing commas: conflicts with the formatter
    "D203",   # one blank line before a class docstring: conflicts with D211
    "D213",   # multi-line summary on the second line: conflicts with D212
    "FIX002", # TODO comments are tracked by the issue tracker, not banned
    "TD003",  # TODO issue links: comments carry no issue numbers
    "ISC001", # implicit string concatenation: conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how a test states its expectation
    "PLR2004", # a test names its expected values inline
    "D",       # a test's name is its documentation
    "ANN401",  # fixtures may be generic
    "S105",    # test passwords are fixtures, not secrets
    "S106",
    "ARG001",  # a fake keeps the signature its caller expects, used or not
    "ARG002",
]
# Alembic loads migration scripts by path; they are not an importable package.
"src/medleyplay/persistence/migrations/**" = ["INP001"]
# The end-to-end server is a script Playwright runs by path, not a package.
"web/e2e/**" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["medleyplay"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 40

[tool.ruff.format]
docstring-code-format = true

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
files = ["src", "tests", "web/e2e"]
python_version = "3.13"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ── import-linter ───────────────────────────────────────────────────────────
# The layers of the core; a test runs these contracts with the rest of the suite.
[tool.importlinter]
root_package = "medleyplay"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core is layered: web, then application, then persistence, then domain"
type = "layers"
layers = [
    "medleyplay.__main__",
    "medleyplay.server",
    "medleyplay.config",
    "medleyplay.web",
    "medleyplay.application",
    "medleyplay.persistence",
    "medleyplay.domain",
]

[[tool.importlinter.contracts]]
name = "The domain uses no framework"
type = "forbidden"
source_modules = ["medleyplay.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "alembic", "pwdlib", "uvicorn"]

[[tool.importlinter.contracts]]
name = "Only the web layer and the composition root use the web framework"
type = "forbidden"
source_modules = ["medleyplay.application", "medleyplay.persistence"]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

[[tool.importlinter.contracts]]
name = "The plugin API stands alone: a plugin importing it gets nothing of the core"
type = "forbidden"
source_modules = ["medleyplay.plugin_api"]
forbidden_modules = [
    "medleyplay.__main__",
    "medleyplay.server",
    "medleyplay.config",
    "medleyplay.web",
    "medleyplay.application",
    "medleyplay.persistence",
    "medleyplay.domain",
    "medleyplay.plugin_host",
    "medleyplay.programs",
    "medleyplay.plugins",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "The plugin host and Job programs never touch the database or the web"
type = "forbidden"
source_modules = ["medleyplay.plugin_host", "medleyplay.programs"]
forbidden_modules = [
    "medleyplay.__main__",
    "medleyplay.server",
    "medleyplay.config",
    "medleyplay.web",
    "medleyplay.application",
    "medleyplay.persistence",
    "medleyplay.domain",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "A plugin imports only the plugin API"
type = "forbidden"
source_modules = ["medleyplay.plugins"]
forbidden_modules = [
    "medleyplay.__main__",
    "medleyplay.server",
    "medleyplay.config",
    "medleyplay.web",
    "medleyplay.application",
    "medleyplay.persistence",
    "medleyplay.domain",
    "medleyplay.plugin_host",
    "medleyplay.programs",
]

[[tool.importlinter.contracts]]
name = "The core never imports a plugin; only the plugin host loads them, by name"
type = "forbidden"
source_modules = [
    "medleyplay.__main__",
    "medleyplay.server",
    "medleyplay.config",
    "medleyplay.web",
    "medleyplay.application",
    "medleyplay.persistence",
    "medleyplay.domain",
    "medleyplay.plugin_host",
    "medleyplay.plugin_api",
    "medleyplay.programs",
]
forbidden_modules = ["medleyplay.plugins"]

# ── bandit ──────────────────────────────────────────────────────────────────
# Runs over `src` in CI (`bandit -c pyproject.toml -r src`). Tests are excluded
# because they use `assert` (B101) by design and never ship.
[tool.bandit]
exclude_dirs = ["tests"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: every test is independent and builds its own fixtures.
addopts = ["-ra", "--strict-markers", "--strict-config", "-n", "auto"]
xfail_strict = true
filterwarnings = ["error"]

# ── coverage ────────────────────────────────────────────────────────────────
# Floors (90% line, 85% branch) are enforced in CI, which reads the JSON report so
# each is checked on its own; see CONTRIBUTING.md.
[tool.coverage.run]
branch = true
source = ["medleyplay"]
# Plugin hosts run in their own processes; measure them too, including those that
# end with `os._exit`.
patch = ["subprocess", "_exit"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]
