[project]
name = "stream"
version = "0.0.0"
description = "Play music on your local network, from your own files and from Bilibili."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit",
    "hypothesis",
    "mypy",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Strict but sensible: start from `ALL` so a rule category is never missed by
# omission, then name each exclusion and the reason for it. A new ruff release can
# add rules, which show up as lint failures in the upgrade pull request.
select = ["ALL"]
ignore = [
    "CPY001", # copyright headers: the LICENSE file covers the repository
    "COM812", # trailing commas: conflicts with the formatter
    "D203",   # one blank line before a class docstring: conflicts with D211
    "D213",   # multi-line summary on the second line: conflicts with D212
    "FIX002", # TODO comments are tracked by the issue tracker, not banned
    "TD003",  # TODO issue links: comments carry no issue numbers
    "ISC001", # implicit string concatenation: conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how a test states its expectation
    "PLR2004", # a test names its expected values inline
    "D",       # a test's name is its documentation
    "ANN401",  # fixtures may be generic
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["stream"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 40

[tool.ruff.format]
docstring-code-format = true

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.13"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# ── bandit ──────────────────────────────────────────────────────────────────
# Runs over `src` in CI (`bandit -c pyproject.toml -r src`). Tests are excluded
# because they use `assert` (B101) by design and never ship.
[tool.bandit]
exclude_dirs = ["tests"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default: every test is independent and builds its own fixtures.
addopts = ["-ra", "--strict-markers", "--strict-config", "-n", "auto"]
xfail_strict = true
filterwarnings = ["error"]

# ── coverage ────────────────────────────────────────────────────────────────
# Floors (90% line, 85% branch) are enforced in CI, which reads the JSON report so
# each is checked on its own; see CONTRIBUTING.md.
[tool.coverage.run]
branch = true
source = ["stream"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]
